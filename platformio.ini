; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_src_filter =
    +<main.cpp>
    +<esp32_cam_controller.cpp>
    +<esp32_rtsp_streamer.cpp>
    -<tcp_cam_streamer.cpp>

; Monitor and first USB upload
; monitor_speed = 115200
; upload_speed = 115200

; OTA needs two app partitions. The esp32cam board default is huge_app.csv,
; which is fine for serial flashing but not for OTA updates.
board_build.partitions = min_spiffs.csv


upload_protocol = espota
upload_port = 192.168.178.46
upload_flags =
    --auth=1234
    --host_ip=192.168.178.27
    --host_port=3233
    --debug

; DIESE DREI ZEILEN SIND ZWINGEND ERFORDERLICH:
board_build.f_cpu = 240000000L
build_flags =
    -D BOARD_HAS_PSRAM
